# Workshop smoke: production-build E2E on macOS, Windows, and Ubuntu.
#
# Goal: catch regressions that would break a workshop delivery before the
# room. Unlike e2e.yml (Cognito auth against a dev pool), this runs
# the PRODUCTION BUILD path — one process, one port, self-hosted
# fonts, `?reset=1`, triage fast-path — with no AWS secrets required.
#
# The specs run without Cognito or AWS credentials. The real-query
# check accepts the app's graceful fallback response when Bedrock is
# not available.

name: workshop-smoke

on:
  push:
    branches: [mainline, main]
  pull_request:
    branches: [mainline, main]
  workflow_dispatch: {}

concurrency:
  group: workshop-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.os }} production-build smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PELLIER_SMOKE_MODE: "true"
      DB_HOST: localhost
      DB_NAME: pellier_smoke
      DB_USER: pellier_smoke
      DB_PASSWORD: pellier_smoke
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: pellier/frontend
        run: npm ci

      - name: Build frontend (production)
        working-directory: pellier/frontend
        run: npm run build

      - name: Install backend deps
        working-directory: pellier/backend
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        working-directory: pellier/frontend
        run: npx playwright install --with-deps chromium

      # POSIX runners keep the nohup'ed uvicorn process alive across the
      # next step. Windows does not reliably preserve the background
      # process, so the Windows Playwright step starts and stops uvicorn
      # inside the same PowerShell process below.
      - name: Start uvicorn (POSIX)
        if: runner.os != 'Windows'
        working-directory: pellier/backend
        run: |
          nohup uvicorn app:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sSf http://localhost:8000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "uvicorn did not start"; cat /tmp/uvicorn.log; exit 1

      - name: Run Playwright smoke specs
        if: runner.os != 'Windows'
        working-directory: pellier/frontend
        env:
          E2E_BASE_URL: http://localhost:8000
        run: npx playwright test e2e/workshop-smoke.spec.ts

      - name: Run Playwright smoke specs (Windows)
        if: runner.os == 'Windows'
        working-directory: pellier/frontend
        shell: pwsh
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
        run: |
          $out = Join-Path $env:TEMP "uvicorn.log"
          $err = Join-Path $env:TEMP "uvicorn.err"
          $health = "http://127.0.0.1:8000/api/health"
          $proc = Start-Process -PassThru -NoNewWindow -FilePath "python" `
            -ArgumentList "-m", "uvicorn", "app:app", "--host", "127.0.0.1", "--port", "8000" `
            -WorkingDirectory "..\backend" `
            -RedirectStandardOutput $out `
            -RedirectStandardError  $err

          $ready = $false
          for ($i=0; $i -lt 40; $i++) {
            if ($proc.HasExited) {
              Write-Host "uvicorn exited before becoming ready"
              Get-Content $out -ErrorAction SilentlyContinue
              Get-Content $err -ErrorAction SilentlyContinue
              exit 1
            }
            curl.exe -fsS $health | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 1
          }

          if (-not $ready) {
            Write-Host "uvicorn did not start"
            Get-Content $out -ErrorAction SilentlyContinue
            Get-Content $err -ErrorAction SilentlyContinue
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
            exit 1
          }

          npx playwright test e2e/workshop-smoke.spec.ts
          $playwrightExit = $LASTEXITCODE

          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force
          }

          exit $playwrightExit

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workshop-smoke-report-${{ matrix.os }}
          path: pellier/frontend/playwright-report
          if-no-files-found: ignore
