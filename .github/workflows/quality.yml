name: quality

# Test gate for the one-hour builders session on `main`.
#
# Before this existed, nothing verified `main` on push or PR: chromatic.yml
# self-skips unless CHROMATIC_PROJECT_TOKEN is set, every step in e2e.yml is
# gated on the E2E_* secrets being present, and workshop-smoke.yml is
# workflow_dispatch only. So the branch with the least room for live recovery
# was the unguarded one.
#
# This is CI configuration, not a governed feature backport — the branch
# contract in CLAUDE.md forbids porting `governed` behaviour into `main`, and
# nothing here changes application code. Keep the two files in sync when the
# gates change.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and shell validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # tests/conftest.py pins hermetic settings, so the suite does not need DB
    # credentials. AWS_REGION stays set because some modules read it at import
    # time, and a runner has no ambient region.
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pellier/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: pellier/backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: pellier/backend
        run: python -m pytest -q

      - name: Validate shell scripts
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

  frontend:
    name: Frontend tests, build, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pellier/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: pellier/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: pellier/frontend
        run: npm test -- --run

      - name: Type-check
        working-directory: pellier/frontend
        run: npm run type-check

      - name: Lint
        working-directory: pellier/frontend
        run: npm run lint

      - name: Build
        working-directory: pellier/frontend
        run: npm run build

      - name: Audit production dependencies
        working-directory: pellier/frontend
        run: npm audit --omit=dev --audit-level=high
